name: Daily LinkedIn Recruiter Outreach

on:
  schedule:
    - cron: '0 5 * * *'  # 10:30 AM IST = 05:00 AM UTC
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run outreach automation
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        ANUJ_EMAIL: ${{ secrets.ANUJ_EMAIL }}
        ANUJ_PHONE: ${{ secrets.ANUJ_PHONE }}
        RESUME_TEMPLATE_PATH: resume_template.txt
      run: |
        python automated_outreach.py
    
    - name: Upload Excel tracker
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: recruiter_tracking
        path: recruiter_tracking.xlsx
        retention-days: 30
    
